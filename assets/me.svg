text{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif}
.m{font-family:'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}

.row{animation:fadein .6s ease-out backwards}
@keyframes fadein{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.ha{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:step-end}
@keyframes ha0{0%,20.00%{opacity:1}20.01%,100%{opacity:0}}
@keyframes ha1{0%,19.99%{opacity:0}20.00%,40.00%{opacity:1}40.01%,100%{opacity:0}}
@keyframes ha2{0%,39.99%{opacity:0}40.00%,60.00%{opacity:1}60.01%,100%{opacity:0}}
@keyframes ha3{0%,59.99%{opacity:0}60.00%,80.00%{opacity:1}80.01%,100%{opacity:0}}
@keyframes ha4{0%,79.99%{opacity:0}80.00%,100%{opacity:1}}

.hb{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:step-end}
@keyframes hb0{0%,16.67%{opacity:1}16.68%,100%{opacity:0}}
@keyframes hb1{0%,16.66%{opacity:0}16.67%,33.33%{opacity:1}33.34%,100%{opacity:0}}
@keyframes hb2{0%,33.32%{opacity:0}33.33%,50.00%{opacity:1}50.01%,100%{opacity:0}}
@keyframes hb3{0%,49.99%{opacity:0}50.00%,66.67%{opacity:1}66.68%,100%{opacity:0}}
@keyframes hb4{0%,66.66%{opacity:0}66.67%,83.33%{opacity:1}83.34%,100%{opacity:0}}
@keyframes hb5{0%,83.32%{opacity:0}83.33%,100%{opacity:1}}

.led{animation:blink 1.6s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.q{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
