<polygon points="84,21 89,26 84,31 79,26" fill="#b8472f" stroke="none" stroke-width="1" />
<text x="100" y="32" font-size="20" fill="#4a4640" letter-spacing="4">USER PREFERENCES</text>
<text x="976" y="32" font-size="11" fill="#5f5b4e" text-anchor="end" letter-spacing="2">// PERSONAL ARCHIVE</text>
<path d="M10 50H990" stroke="#8f8b78" stroke-width="1"/>
<path class="ln" d="M10 50H990" pathLength="1" stroke="#4a4640" stroke-width="3" fill="none" stroke-dasharray="1" stroke-dashoffset="0"/>
