<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56" role="img" aria-label="WHAT INSPIRES ME">
<title>WHAT INSPIRES ME</title>
<defs></defs>
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif}
.m{font-family:'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}

.ln{animation:draw 1.4s ease-out backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mk{animation:blink 1.4s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
